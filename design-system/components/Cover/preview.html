<!-- @dsCard height=288 -->
<div style="width:960px;height:288px;position:relative;background:var(--bg);color:var(--text);font-family:var(--font-sans);overflow:hidden">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true" style="position:absolute;inset:0">
<!-- Blocks: main 256x144, main-soft 240x96, success 144x96.
Arrangement: right-aligned sentence strips cut into unequal word tiles.
Pattern: modular word-sized tiles reflect cutting a sentence into words.
Scale: space-1/space-2/space-3 and radius-lg. -->
<style>.brand{fill:var(--main)}.soft{fill:var(--main-soft)}.ink{fill:var(--text)}.green{fill:var(--success)}.tile{rx:var(--radius-lg)}</style>
<rect class="brand tile" x="480" y="24" width="256" height="144"></rect><rect class="soft tile" x="752" y="24" width="184" height="96"></rect><rect class="green tile" x="752" y="136" width="144" height="96"></rect><rect class="soft tile" x="480" y="184" width="112" height="80"></rect><rect class="ink tile" x="608" y="184" width="128" height="80"></rect><rect class="brand tile" x="912" y="136" width="24" height="128"></rect>
</svg>
<h1 style="position:absolute;left:24px;bottom:72px;max-width:440px;margin:0;font-size:72px;line-height:0.95;letter-spacing:0">PhraseCut</h1>
<p style="position:absolute;left:24px;bottom:32px;margin:0;font-size:14px;color:var(--muted)">Learn words from sentences you like.</p>
</div>
